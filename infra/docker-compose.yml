version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terracollect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: terracollect
      POSTGRES_PASSWORD: terracollect_dev
      POSTGRES_DB: terracollect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terracollect"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: terracollect-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: terracollect
      MINIO_ROOT_PASSWORD: terracollect_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: terracollect-storage-init
    restart: "no"
    entrypoint: |
      sh -c "
        echo '⏳ Waiting for MinIO...' &&
        until mc alias set local http://terracollect-storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null; do
          sleep 2
        done &&
        echo '✅ Creating buckets...' &&
        mc mb local/terracollect-media 2>/dev/null || echo '  ⚠️  Bucket already exists' &&
        mc mb local/terracollect-exports 2>/dev/null || echo '  ⚠️  Bucket already exists' &&
        mc mb local/terracollect-tiles 2>/dev/null || echo '  ⚠️  Bucket already exists' &&
        mc anonymous set private local/terracollect-media &&
        mc anonymous set private local/terracollect-exports &&
        mc anonymous set download local/terracollect-tiles &&
        echo '✅ MinIO buckets initialized'
      "
    environment:
      MINIO_ROOT_USER: terracollect
      MINIO_ROOT_PASSWORD: terracollect_dev
    depends_on:
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: terracollect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
  redisdata:
